name: Deploy lên Hostinger (FTP)

# Mỗi lần push lên nhánh main, GitHub tự upload code sang Hostinger.
# Cần tạo 4 Secret trong GitHub: Settings -> Secrets and variables -> Actions
#   FTP_SERVER   (vd: ftp.tenmien.com hoặc IP trong hPanel -> Files -> FTP Accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_DIR      (vd: /public_html/  – phải có dấu / ở cuối)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            schema.sql
            api/config.php
